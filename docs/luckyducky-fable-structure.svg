<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2400" viewBox="0 0 1200 2400">
  <defs>
    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f7f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#929292"/>
    </marker>
    <style>
      .cn { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { fill: #ffffff; font-size: 42px; font-weight: 800; letter-spacing: 1px; }
      .sub { fill: #9b9b9b; font-size: 23px; }
      .label { fill: #222222; font-size: 26px; font-weight: 700; }
      .small { fill: #666666; font-size: 20px; }
      .tiny { fill: #8a8a8a; font-size: 17px; }
      .node { fill: #ffffff; stroke: #dadada; stroke-width: 2; }
      .node-dark { fill: #181818; stroke: #3d3d3d; stroke-width: 2; }
      .node-accent { fill: #fbf8ff; stroke: #bfa7dc; stroke-width: 3; }
      .node-green { fill: #f6fbf7; stroke: #afd4ba; stroke-width: 2; }
      .node-yellow { fill: #fffaf0; stroke: #ebc56a; stroke-width: 2; }
      .line { stroke: #aaaaaa; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #d2d2d2; stroke-width: 2; fill: none; }
      .pill { fill: #242424; }
      .pill-text { fill: #ffffff; font-size: 19px; font-weight: 700; }
    </style>
  </defs>

  <!-- Reference-image-like mobile poster shell -->
  <rect width="1200" height="2400" fill="url(#black)"/>
  <text x="64" y="82" class="cn sub">20:26</text>
  <text x="965" y="82" class="cn sub">● 5G  ▰ 86%</text>
  <text x="65" y="170" class="cn" fill="#ffffff" font-size="48">‹</text>
  <text x="1100" y="170" class="cn" fill="#ffffff" font-size="45">⋮</text>

  <!-- Account header -->
  <circle cx="116" cy="292" r="62" fill="#f4bd55"/>
  <circle cx="116" cy="292" r="51" fill="#ffd875" stroke="#ffffff" stroke-width="3"/>
  <text x="116" y="306" text-anchor="middle" class="cn" font-size="48">🦆</text>
  <text x="205" y="280" class="cn title" font-size="32">LuckyDucky 小棉鸭</text>
